# Kaggle kernel 状态探针:查任意 kernel 的真实状态,完成则顺带取输出。
# 用于 kaggle-7b 长跑期间的可见性(Actions 轮询只看字符串,此处直接落状态与日志)。

name: kaggle-status

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "kernel slug(不含用户名)"
        default: "df-7b-arm4a-funnel-verify-s42"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: pip install --quiet kaggle
      - name: Probe accelerator 枚举(kaggle 包源码)
        run: |
          python - <<'PYEOF'
          import kaggle, pathlib, re
          root = pathlib.Path(kaggle.__file__).parent
          hits = set()
          for f in root.rglob("*.py"):
              txt = f.read_text(errors="ignore")
              for m in re.finditer(r"nvidia[A-Za-z0-9]*|accelerator[\"']?\s*[:=]", txt):
                  line = txt[max(0,m.start()-80):m.end()+120].replace("\n"," ")
                  hits.add(line.strip()[:200])
          for h in sorted(hits)[:40]:
              print("HIT:", h)
          PYEOF
      - name: Status + try output
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          echo "===== status ====="
          kaggle kernels status "s4526291/${{ inputs.slug }}" || true
          echo "===== kernels list (mine, recent) ====="
          kaggle kernels list --mine --page-size 5 || true
          echo "===== try output (only works when complete/error) ====="
          kaggle kernels output "s4526291/${{ inputs.slug }}" -p out >/dev/null 2>&1 \
            || echo "(output 下载整体报错——但可能部分成功,继续尝试读取)"
          echo "--- eval_report.json ---"
          cat out/eval_report.json 2>/dev/null || echo "(无 eval_report.json)"
          echo "--- generations 前 5 条(诊断模型实际输出)---"
          head -5 out/result/generations.jsonl 2>/dev/null | cut -c1-1500 || echo "(无 generations.jsonl)"
          echo "--- 复判(协议判分器 eval_math;修 run5 判分口径 bug 后可离线重打分)---"
          if [ -f out/result/generations.jsonl ] && [ -f out/repo/scripts/eval_math.py ]; then
            python out/repo/scripts/eval_math.py --generations out/result/generations.jsonl \
              --evalset out/repo/evalsets/math_zh_v1.jsonl --report rescore.json || true
            echo "RESCORE_JSON_HEAD:"; head -c 400 rescore.json 2>/dev/null || true; echo
          else
            echo "(缺 generations 或仓库判分器,跳过复判)"
          fi
          echo "--- log tail ---"
          tail -40 out/*.log 2>/dev/null || true
