# 运维诊断:Render 部署清单/构建日志 + 生产探针(健康/注册/登录冒烟)
name: render-diag

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "probe=1 时对生产打注册+登录探针(walkthrough_probe_<run> 用户,随机密码)"
        default: "0"
        required: false

jobs:
  probe:
    if: ${{ inputs.probe == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health + register + login smoke
        run: |
          BASE=https://datafoundry.onrender.com
          echo "== /health =="; curl -sS -m 60 $BASE/health; echo
          U="walkthrough_probe_${GITHUB_RUN_NUMBER}"
          P=$(openssl rand -hex 12)
          echo "== register $U =="
          code=$(curl -sS -o /tmp/reg.json -w '%{http_code}' -X POST $BASE/auth/register \
            -H 'Content-Type: application/json' -d "{\"username\": \"$U\", \"password\": \"$P\"}")
          echo "HTTP $code"; cat /tmp/reg.json; echo
          echo "== login =="
          code2=$(curl -sS -o /tmp/login.json -w '%{http_code}' -X POST $BASE/auth/login \
            -H 'Content-Type: application/json' -d "{\"username\": \"$U\", \"password\": \"$P\"}")
          echo "HTTP $code2"; python3 -c "import json; d=json.load(open('/tmp/login.json')); print('token_present:', bool(d.get('token')), '| role:', d.get('role'))" || cat /tmp/login.json
          echo "== console 401 契约 =="
          curl -sS -o /dev/null -w 'console_unauth: %{http_code}\n' $BASE/console
          test "$code" = "200" -a "$code2" = "200"
          echo "探针用户 $U 留存于生产(引导版画像见审计日志);管理员可随时删除"

  diag:
    if: ${{ inputs.probe != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List deploys + fetch build logs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, urllib.request, os

          key = os.environ["RENDER_API_KEY"]
          srv = "srv-d9tg246417fc73eb71jg"

          def api(path):
              req = urllib.request.Request(
                  f"https://api.render.com/v1{path}",
                  headers={"Authorization": f"Bearer {key}", "Accept": "application/json"})
              return json.loads(urllib.request.urlopen(req, timeout=30).read())

          deploys = api(f"/services/{srv}/deploys?limit=5")
          for d in deploys:
              dd = d["deploy"]
              print("DEPLOY:", dd["id"], dd["status"], dd.get("trigger"),
                    dd.get("createdAt"), (dd.get("commit") or {}).get("id", "")[:9],
                    (dd.get("commit") or {}).get("message", "").split("\n")[0][:50])
          latest = deploys[0]["deploy"]["id"]
          import urllib.parse
          owner = "tea-d9tg011t0dsc73b7e230"
          for params in (
              [("ownerId", owner), ("resourceIds[]", srv), ("type", "build"), ("limit", "100"), ("direction", "backward")],
              [("ownerId", owner), ("resourceIds[]", srv), ("limit", "100"), ("direction", "backward")],
              [("ownerId", owner), ("resource", srv), ("limit", "100")],
          ):
              qs = urllib.parse.urlencode(params)
              try:
                  logs = api(f"/logs?{qs}")
                  entries = logs.get("logs", logs if isinstance(logs, list) else [])
                  print(f"--- logs via {qs}: {len(entries)} entries")
                  for e in entries[-80:]:
                      msg = e.get("message", e.get("text", str(e)))
                      print(str(e.get("timestamp", ""))[:19], msg[:280])
                  break
              except Exception as exc:
                  print(f"logs query {qs} failed: {exc}")
          EOF
